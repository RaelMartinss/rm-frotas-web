<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>RM Frotas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080B0C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RM Motorista">
  <link rel="manifest" href="manifest.webmanifest?v=5">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=5">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=5">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png?v=5">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512x512.png?v=5">
  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.8; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #080B0C;
      background-image: radial-gradient(circle at 50% 45%, rgba(255, 107, 0, 0.08) 0%, transparent 60%);
      font-family: 'Inter Variable', 'Inter', system-ui, -apple-system, sans-serif;
      z-index: 99999;
    }
    .app-splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .app-splash-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #FF6B00 0%, #E05D00 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(255, 107, 0, 0.45);
      animation: pulse-glow 2s ease-in-out infinite;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .app-splash-logo svg {
      width: 30px;
      height: 30px;
      color: white;
    }
    .app-splash-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      margin: 0;
    }
    .app-splash-title span {
      color: #FF6B00;
    }
    .app-splash-subtitle {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8E9DA8;
      margin-top: -8px;
    }
    .app-splash-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: #FF6B00;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255, 107, 0, 0.35);
      animation: spin 0.7s linear infinite;
    }
    .app-splash-status {
      font-size: 12px;
      font-weight: 500;
      color: #8E9DA8;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <app-root>
    <div class="app-splash">
      <div class="app-splash-card">
        <div class="app-splash-logo">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" />
          </svg>
        </div>
        <h1 class="app-splash-title">RM <span>Frotas</span></h1>
        <div class="app-splash-subtitle">Portal Operacional</div>
        <div class="app-splash-status">
          <div class="app-splash-spinner"></div>
          <span>Carregando sistema...</span>
        </div>
      </div>
    </div>
  </app-root>
</body>
</html>
