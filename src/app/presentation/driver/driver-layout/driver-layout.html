<div class="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans select-none antialiased">
  <!-- CABEÇALHO COMPACTO MOBILE -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between shadow-xs">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="size-8 rounded-xl bg-emerald-500 text-slate-950 flex items-center justify-center font-black text-xs shrink-0 shadow-xs">
        {{ currentUser()?.name?.substring(0, 2)?.toUpperCase() || 'MO' }}
      </div>
      <div class="min-w-0">
        <div class="flex items-center gap-1.5">
          <span class="text-xs font-bold text-white truncate">{{ currentUser()?.name }}</span>
        </div>
        <div class="flex items-center gap-1 text-[10px] text-slate-400 truncate">
          @if (currentUser()?.clientName) {
            <span class="truncate font-medium text-emerald-400">{{ currentUser()?.clientName }}</span>
            <span>•</span>
          }
          <span>Motorista</span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Indicador Online/Offline -->
      @if (isOnline()) {
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-950/80 text-emerald-400 border border-emerald-800/50">
          <span class="size-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          Online
        </span>
      } @else {
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-950/80 text-amber-400 border border-amber-800/50 animate-bounce">
          <span class="size-1.5 rounded-full bg-amber-400"></span>
          Offline
        </span>
      }

      <!-- Botão Sair -->
      <button
        (click)="logout()"
        title="Sair"
        class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded-xl transition-colors cursor-pointer"
      >
        <svg lucideLogOut class="size-4"></svg>
      </button>
    </div>
  </header>

  <!-- ÁREA PRINCIPAL COM SCROLL SUAVE -->
  <main class="flex-1 overflow-y-auto pb-24 px-4 pt-4 max-w-lg mx-auto w-full">
    <router-outlet></router-outlet>
  </main>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR MOBILE (THUMB ZONE) -->
  <nav class="fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800/80 z-40 max-w-lg mx-auto">
    <div class="grid grid-cols-2 h-16 px-6">
      <!-- Aba: Cockpit / Início -->
      <a
        routerLink="/motorista"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="text-emerald-400 font-bold"
        class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-white transition-colors cursor-pointer"
      >
        <svg lucideNavigation class="size-5"></svg>
        <span class="text-[11px] leading-none">Cockpit</span>
      </a>

      <!-- Aba: Histórico -->
      <a
        routerLink="/motorista/historico"
        routerLinkActive="text-emerald-400 font-bold"
        class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-white transition-colors cursor-pointer relative"
      >
        <div class="relative">
          <svg lucideClock class="size-5"></svg>
          @if (pendingReceipts() > 0) {
            <span class="absolute -top-1.5 -right-2 px-1.5 py-0.2 bg-amber-500 text-slate-950 font-black text-[9px] rounded-full border border-slate-900 animate-pulse">
              {{ pendingReceipts() }}
            </span>
          }
        </div>
        <span class="text-[11px] leading-none">Histórico</span>
      </a>
    </div>
  </nav>
</div>
